<title>Cuentas Claras</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Manrope:wght@400;500;600;700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* Layout: una columna estilo app de celular (máx 560px), barra inferior con 3 secciones.
   Tema único: fondo blanco con acentos pastel (pedido explícito), texto oscuro para que se lea bien. */
:root{
  color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#FFFFFF; --surface:#FFFFFF; --surface-2:#F5F3FA; --fg:#2B2838; --muted:#77738A; --line:#ECE9F3;
  --accent:#4E8C7A; --accent-soft:#DDF3EA; --accent-ink:#1F4A3E;
  --mint:#DDF3EA; --peach:#FFE6DA; --lav:#ECE7FD; --sky:#E1F0FB; --butter:#FFF4CC; --rose:#FCE4EE;
  --debt:#C2603A; --debt-soft:#FFE6DA; --ok:#2F8A5B; --ok-soft:#DDF3EA; --danger:#C2453A;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Manrope","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);margin:0;letter-spacing:-.01em;text-wrap:balance}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 120px;display:grid;gap:14px}

.top{display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px}
.top h1{font-size:18px;white-space:nowrap}
.top small{display:block;font-size:11.5px;color:var(--muted);font-weight:600}
.mnav{display:flex;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.mnav button{border:0;background:none;width:36px;height:38px;font-size:20px;color:var(--muted);cursor:pointer}
.mnav .lbl{width:auto;padding:0 4px;font-size:14.5px;font-weight:800;color:var(--fg);white-space:nowrap}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0}
.card h2{font-size:17px}
.sub{color:var(--muted);font-size:13px;margin:2px 0 0}
.hero{background:var(--mint);border-color:transparent;color:var(--fg)}
.hero.peach{background:var(--peach)}
.hero .lab{font-size:12px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.hero .big{font-family:var(--f-display);font-weight:800;font-size:38px;line-height:1.05;margin-top:4px}
.hero .row{display:flex;justify-content:space-between;gap:10px;margin-top:10px;font-size:13px;color:var(--muted);font-weight:600;flex-wrap:wrap}
.cupo{background:var(--lav);border-color:transparent;cursor:pointer}
.cupo .top3{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.cupo .lab{font-size:12px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.cupo .big{font-family:var(--f-display);font-weight:800;font-size:24px}
.cupo .track{height:12px;border-radius:99px;background:#fff;overflow:hidden;margin:10px 0 6px;display:flex}
.cupo .track i{display:block;height:100%}
.cupo .meta{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--muted);font-weight:600;flex-wrap:wrap}

.people{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pc{background:color-mix(in srgb,var(--pcol) 28%,#fff);border:2px solid transparent;border-radius:14px;padding:12px;display:grid;gap:6px;cursor:pointer;position:relative;overflow:hidden;text-align:left}
.pc::before{content:"";position:absolute;inset:0 auto 0 0;width:6px;background:var(--pcol)}
.pc[aria-pressed="true"]{border-color:var(--fg)}
.pc .nm{font-weight:800;padding-left:4px;display:flex;align-items:center;justify-content:space-between;gap:6px}
.pc .amt{font-family:var(--f-display);font-weight:800;font-size:21px;padding-left:4px}
.chk{border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:99px;font-size:12px;font-weight:800;padding:3px 9px;cursor:pointer;white-space:nowrap}
.chk.on{background:var(--ok-soft);color:var(--ok);border-color:transparent}

.list{display:grid}
.it{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:10px;align-items:center;padding:11px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.it:last-child{border-bottom:0}
.it .sw{width:10px;height:34px;border-radius:4px;background:var(--pcol)}
.it .t{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it .t small{display:block;font-weight:600;color:var(--muted);font-size:12.5px}
.it .m{font-weight:800;text-align:right}
.it .m small{display:block;font-weight:600;color:var(--muted);font-size:12px}
.tag{display:inline-block;font-size:11px;font-weight:800;padding:0 6px;border-radius:6px;background:var(--surface-2);color:var(--muted);margin-left:4px;vertical-align:1px}
.tag.ci{background:var(--debt-soft);color:var(--debt)}
.sec{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px}
.sec .sub{margin:0}
.filter{font-size:13px;color:var(--muted)}
.filter button{border:0;background:none;color:var(--accent);font-weight:800;cursor:pointer;padding:0}

.prog{display:flex;gap:3px;margin-top:6px}
.prog i{flex:1;height:6px;border-radius:3px;background:var(--surface-2)}
.prog i.p{background:var(--pcol)}
.debtrow{padding:12px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.debtrow:last-child{border-bottom:0}
.debtrow .hd{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.debtrow .hd b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.debtrow .meta{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:12.5px;margin-top:2px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--pcol);vertical-align:0;margin-right:6px;box-shadow:0 0 0 1px rgba(0,0,0,.08)}

.chart{position:relative;height:240px}
.chart.tall{height:280px}
.legend{display:grid;gap:6px;margin-top:10px}
.legend div{display:flex;justify-content:space-between;gap:8px;font-size:13.5px}
.rank{display:grid;gap:9px}
.rank .r .top2{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.bar{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.yeargrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.yeargrid div{background:color-mix(in srgb,var(--pcol,#ECE7FD) 30%,#fff);border-radius:12px;padding:10px}
.yeargrid b{display:block;font-family:var(--f-display);font-size:18px}

.empty{text-align:center;color:var(--muted);padding:18px 6px}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 1fr}
nav.tabs button{border:0;background:none;padding:12px 4px 14px;font-weight:800;font-size:13.5px;color:var(--muted);cursor:pointer;border-top:3px solid transparent}
nav.tabs button[aria-selected="true"]{color:var(--accent);border-top-color:var(--accent)}
.fab{position:fixed;z-index:21;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(70px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;border:0;background:#BFE8D6;color:var(--accent-ink);font-size:30px;font-weight:600;box-shadow:0 6px 18px rgba(60,50,90,.18);cursor:pointer}
@media (min-width:600px){.fab{right:calc(50% - 280px + 8px)}}

.links{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;font-size:13.5px}
.links button{border:0;background:none;color:var(--muted);font-weight:700;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

/* hoja inferior */
.ov{position:fixed;inset:0;z-index:50;background:rgba(8,14,12,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:min(560px,100%);max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:18px max(18px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px));display:grid;gap:14px}
.sheet .hd{display:flex;justify-content:space-between;align-items:center}
.sheet .hd h2{font-size:20px}
.x{border:0;background:var(--surface-2);width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:16px}
.f{display:grid;gap:6px}
.f label,.f .lb{font-size:13px;font-weight:800;color:var(--muted)}
.inp{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;font-size:16px;min-width:0}
.inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface-2);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:none;border-radius:9px;padding:9px 6px;font-weight:800;cursor:pointer;color:var(--muted);line-height:1.2}
.seg button small{display:block;font-weight:600;font-size:11.5px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{border:2px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 14px 7px 10px;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chips button .dot{margin:0}
.chips button[aria-pressed="true"]{border-color:var(--fg);background:var(--surface-2)}
.step{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.step button{border:0;background:var(--surface-2);height:46px;font-size:20px;font-weight:700;cursor:pointer}
.step input{border:0;text-align:center;font-weight:800;font-size:17px;background:transparent;width:100%;min-width:0;padding:0}
.calc{background:var(--surface-2);border-radius:12px;padding:10px 12px;font-size:13.5px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 16px;font-weight:800;cursor:pointer;flex:1}
.btn.pri{background:#BFE8D6;border-color:#BFE8D6;color:var(--accent-ink);flex:2}
.btn.del{color:var(--danger);flex:0 0 auto}
.err{color:var(--danger);font-size:13px;min-height:1em}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.swatches button{width:28px;height:28px;border-radius:50%;border:3px solid transparent;cursor:pointer;box-shadow:0 0 0 1px rgba(0,0,0,.12) inset}
.swatches button[aria-pressed="true"]{border-color:var(--fg)}
.prow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="app">
  <div class="top">
    <div><h1>Cuentas Claras</h1><small id="status">Cargando…</small></div>
    <div class="mnav"><button id="mPrev" aria-label="Mes anterior">‹</button><button class="lbl" id="mLbl" title="Ir al mes actual"></button><button id="mNext" aria-label="Mes siguiente">›</button></div>
  </div>
  <div id="view" style="display:grid;gap:14px"></div>
</div>
<button class="fab" id="fab" aria-label="Agregar gasto">+</button>
<nav class="tabs"><div class="in" role="tablist" id="tabs"></div></nav>
<div id="sheetRoot"></div><div id="toastRoot"></div>

<script>
(() => {
"use strict";
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const CLP=new Intl.NumberFormat("es-CL",{style:"currency",currency:"CLP",maximumFractionDigits:0});
const money=n=>CLP.format(Math.round(n||0));
const short=n=>{n=Math.round(n||0);const a=Math.abs(n);return a>=1e6?"$"+(n/1e6).toLocaleString("es-CL",{maximumFractionDigits:1})+"M":a>=1e3?"$"+Math.round(n/1e3)+"k":"$"+n;};
const pad=n=>String(n).padStart(2,"0");
// los meses de la tarjeta cierran el día 19: del 20 en adelante ya corre el mes siguiente
const CIERRE=19;
const now=new Date(), CAL_M=`${now.getFullYear()}-${pad(now.getMonth()+1)}`;
// el mes de la cuenta es el mes en que se paga: lo comprado hasta el 19 de noviembre se paga en diciembre
const TODAY_M=((k,n)=>{let[y,m]=k.split("-").map(Number);m+=n;while(m>12){m-=12;y++;}return`${y}-${pad(m)}`;})(CAL_M,now.getDate()>CIERRE?2:1);
const INICIO="2026-12"; // meses anteriores al uso de la app se consideran pagados
const addM=(k,n)=>{let[y,m]=k.split("-").map(Number);m+=n;y+=Math.floor((m-1)/12);m=((m-1)%12+12)%12+1;return`${y}-${pad(m)}`;};
const diffM=(a,b)=>{const[y1,m1]=a.split("-").map(Number),[y2,m2]=b.split("-").map(Number);return(y2-y1)*12+(m2-m1);};
const mName=(k,o={month:"long",year:"numeric"})=>{const[y,m]=k.split("-").map(Number);const s=new Date(y,m-1,1).toLocaleDateString("es-CL",o).replace(".","");return s.charAt(0).toUpperCase()+s.slice(1);};
const mShort=k=>mName(k,{month:"short"})+" "+k.slice(2,4);
const parseN=v=>{const neg=/^\s*-/.test(String(v));const n=Number(String(v??"").replace(/[^\d]/g,""))||0;return neg?-n:n;};
const fmtIn=n=>n?Math.round(n).toLocaleString("es-CL"):"";
const genId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const sum=(a,f)=>a.reduce((s,x)=>s+(f(x)||0),0);
const COLORS=["#D9DCE6","#FFE08A","#A8D8F5","#FFC2A6","#F7B5CF","#B5E6CA","#D3C2F5","#A6E3DE","#FFD59E","#C9E89B"];
const CUPO_DEF=1600000;

/* ---- estado ---- */
const COLS=["personas","compras","extras","pagos","config"];
const S={personas:[],compras:[],extras:[],pagos:[],config:[],mes:TODAY_M,tab:"mes",filtro:""};
const cfgT=()=>S.config.find(x=>x.id==="tarjeta")||{};
const cupoMax=()=>cfgT().cupo||CUPO_DEF;
let db=null,mode="loading";
try{const t=localStorage.getItem("cc-celular-tab");if(t)S.tab=t;}catch(e){}

/* ---- guardado (nube o este navegador) ---- */
const LS="cc-celular-data";
const SEED={"personas":[],"compras":[],"extras":[],"pagos":[],"config":[{"id":"tarjeta","cupo":1600000}]};
const persist=()=>{try{const d={};COLS.forEach(c=>d[c]=S[c]);localStorage.setItem(LS,JSON.stringify(d));}catch(e){toast("Este navegador no deja guardar. Descarga un respaldo.");}};
async function save(col,o){const id=o.id||genId();const d={...o};delete d.id;
  if(mode==="db"){try{await db.collection(col).doc(id).set(d);}catch(e){fail(e);throw e;}}
  else{const i=S[col].findIndex(x=>x.id===id);i>=0?S[col][i]={id,...d}:S[col].push({id,...d});persist();changed();}
  return id;}
async function del(col,id){if(mode==="db"){try{await db.collection(col).doc(id).delete();}catch(e){fail(e);throw e;}}else{S[col]=S[col].filter(x=>x.id!==id);persist();changed();}}
function fail(e){toast(e&&e.code==="invalid_argument"?"No tienes permiso para editar. Pide acceso de editora.":"No se pudo guardar. Revisa tu conexión.");}
async function init(){
  let ns=null;
  if(!ns){mode="local";let d=null;try{d=JSON.parse(localStorage.getItem(LS)||"null");}catch(e){}
    if(!d){d=SEED;try{localStorage.setItem(LS,JSON.stringify(d));}catch(e){}}
    COLS.forEach(c=>S[c]=d[c]||[]);status();changed();return;}
  if(false){mode="local";try{const d=JSON.parse(localStorage.getItem(LS)||"{}");COLS.forEach(c=>S[c]=d[c]||[]);}catch(e){}status();changed();return;}
  db=ns;mode="db";const got=new Set();const t=setTimeout(()=>{if(got.size<COLS.length)status("No se pudo conectar todavía…");},10000);
  COLS.forEach(c=>db.collection(c).onSnapshot(s=>{S[c]=s.docs.map(d=>({id:d.id,...d.data()}));if(!s.metadata.fromCache)got.add(c);if(got.size===COLS.length)clearTimeout(t);status();changed();},e=>{clearTimeout(t);status("Error al leer los datos");}));
}
function status(m){$("#status").textContent=m||(mode==="db"?"Guardado en la nube":mode==="local"?"Guardado en este celular":"Cargando…");}

/* ---- cálculos ---- */
const persona=id=>S.personas.find(p=>p.id===id)||{id:"",nombre:"Sin asignar",color:"#9CA3AF"};
const personasOrd=()=>[...S.personas].sort((a,b)=>(a.orden??99)-(b.orden??99));
const nCuota=(c,m)=>diffM(c.primerMes,m)+1;
// valor de la cuota en un mes: los meses importados del Excel usan el valor exacto anotado ese mes
const valor=(c,m)=>{const k=nCuota(c,m);if(k<1||k>(c.cuotas||1))return 0;if(c.valores){if(m in c.valores)return c.valores[m];if(c.hastaExcel&&m<=c.hastaExcel)return 0;}return c.valorCuota||0;};
const cuotasMes=m=>S.compras.map(c=>({c,k:nCuota(c,m),v:valor(c,m)})).filter(x=>x.v);
const extrasMes=m=>S.extras.filter(e=>e.desde<=m&&(e.repite?(!e.hasta||m<=e.hasta):e.desde===m));
const parte=(e,pid)=>{const ps=e.personas||[];if(!ps.includes(pid))return 0;if(ps.length===1)return e.monto;const s=Math.sign(e.monto)||1;return s*Math.ceil(Math.abs(e.monto)/ps.length/100)*100;};
const totPersona=(pid,m)=>sum(cuotasMes(m).filter(x=>(x.c.persona||"")===pid),x=>x.v)+sum(extrasMes(m),e=>parte(e,pid));
// cupo usado: todas las cuotas desde este mes en adelante (lo que aún se le debe al banco)
// cuotas que siguen ocupando cupo: las de meses posteriores al mes de facturación en curso
function cupoUsado(){const per={};let t=0;for(const c of S.compras){const n=c.cuotas||1;for(let i=0;i<n;i++){const m=addM(c.primerMes,i);if(m<TODAY_M)continue;const v=valor(c,m);if(v){t+=v;per[c.persona||""]=(per[c.persona||""]||0)+v;}}}return{t,per};}
// cupo real: el disponible que informó el banco, menos las compras agregadas después de esa fecha
function cupoReal(){const max=cupoMax(),cfg=cfgT(),est=cupoUsado();
  if(cfg.disponible==null)return{max,usado:est.t,disp:max-est.t,per:est.per,real:false};
  // solo compras agregadas en la app (tienen hora de creación) después del dato del banco
  const nuevas=S.compras.filter(c=>String(c.creado||"").includes("T")&&c.creado>cfg.fecha);const disp=cfg.disponible-sum(nuevas,c=>c.total);
  return{max,usado:max-disp,disp,per:est.per,real:true,fecha:cfg.fecha,nuevas:nuevas.length};}
function cupoHTML(){const {max,usado,disp,per,real,fecha,nuevas}=cupoReal();const tp=sum(Object.values(per),x=>x)||1;
  const f=fecha?new Date(fecha).toLocaleDateString("es-CL",{day:"numeric",month:"short"}).replace(".",""):"";
  return `<div class="card cupo" data-act="cupo" role="button" tabindex="0"><div class="top3"><span class="lab">Cupo disponible</span><span class="sub" style="margin:0">de ${money(max)}</span></div>
  <div class="top3" style="margin-top:4px"><span class="big num" style="color:${disp<0?"var(--danger)":"var(--ok)"}">${money(disp)}</span><b class="num">${money(usado)} <span style="font-weight:600;color:var(--muted)">usado</span></b></div>
  <div class="track" aria-label="Cupo usado ${Math.round(usado/max*100)}%">${idsTodos().filter(id=>per[id]).map(id=>`<i style="width:${per[id]/tp*usado/max*100}%;background:${persona(id).color}" title="${esc(persona(id).nombre)}"></i>`).join("")}</div>
  <div class="meta"><span>${Math.round(usado/max*100)}% usado · ${real?`dato del banco al ${f}${nuevas?` − ${nuevas} compra${nuevas>1?"s":""} nueva${nuevas>1?"s":""}`:""}`:"estimado"}</span><span>Toca para actualizar</span></div>
  <div class="meta" style="margin-top:4px"><span>${idsTodos().filter(id=>per[id]).map(id=>`<span class="dot" style="--pcol:${persona(id).color}"></span>${esc(persona(id).nombre)} ${short(per[id])}`).join(" &nbsp;")}</span></div></div>`;}
const idsTodos=()=>{const ids=personasOrd().map(p=>p.id);if(S.compras.some(c=>!S.personas.find(p=>p.id===c.persona)))ids.push("");return ids;};
const totMes=m=>sum(idsTodos(),pid=>totPersona(pid,m));
const pagado=(pid,m)=>{if(m<INICIO)return true;const d=S.pagos.find(p=>p.id===m);return!!(d&&d.p&&d.p[pid]);};
function estado(c){const n=c.cuotas||1;let pag=0,falta=0;for(let i=0;i<n;i++){const m=addM(c.primerMes,i);const v=valor(c,m);if(!v){pag++;continue;}if(m<TODAY_M||pagado(c.persona||"",m))pag++;else falta+=v;}return{n,pag,falta,ult:addM(c.primerMes,n-1),actual:Math.min(n,Math.max(0,nCuota(c,TODAY_M)))};}

/* ---- render ---- */
let rq=false;function changed(){if(!rq){rq=true;setTimeout(()=>{rq=false;render();},0);}}
const charts=[];
function render(){
  charts.splice(0).forEach(c=>{try{c.destroy();}catch(e){}});
  $("#mLbl").textContent=mName(S.mes);
  $("#tabs").innerHTML=[["mes","Mes"],["deudas","Deudas"],["graficos","Gráficos"]].map(([k,l])=>`<button role="tab" data-tab="${k}" aria-selected="${S.tab===k}">${l}</button>`).join("");
  if(mode==="loading"){$("#view").innerHTML=`<div class="card empty">Cargando…</div>`;return;}
  $("#view").innerHTML=({mes:vMes,deudas:vDeudas,graficos:vGraf})[S.tab]();
  if(S.tab==="graficos")drawCharts();
}
const pcStyle=p=>`style="--pcol:${p.color}"`;
function vMes(){
  const m=S.mes,cm=cuotasMes(m),ex=extrasMes(m),total=totMes(m),sig=totMes(addM(m,1));
  const ids=idsTodos().filter(id=>totPersona(id,m)!==0||S.filtro===id);
  const debe=sum(ids.filter(id=>!pagado(id,m)),id=>totPersona(id,m));
  let items=cm.sort((a,b)=>(personasOrd().findIndex(p=>p.id===a.c.persona))-(personasOrd().findIndex(p=>p.id===b.c.persona))||b.v-a.v);
  if(S.filtro!=="")items=items.filter(x=>(x.c.persona||"")===S.filtro);
  const exF=S.filtro!==""?ex.filter(e=>(e.personas||[]).includes(S.filtro)):ex;
  return `
  ${!S.compras.length?`<div class="card" style="background:var(--butter);border-color:transparent"><h2>Carga tus datos</h2><p class="sub" style="margin:6px 0 12px">Toca el botón y elige el archivo de respaldo que te mandaron (termina en .json). Se hace una sola vez.</p><button class="btn pri" style="width:100%" data-act="restore">Cargar respaldo</button></div>`:""}
  <div class="card hero"><div class="lab">Total de ${mName(m,{month:"long"})} · <span style="color:${m<TODAY_M?"var(--muted)":"var(--accent)"}">${m<TODAY_M?"Ya pagado · cerró el "+CIERRE+" de "+mName(addM(m,-1),{month:"long"}).toLowerCase():m===TODAY_M?"Vigente · cierra el "+CIERRE+" de "+mName(addM(m,-1),{month:"long"}).toLowerCase():"Próximo"}</span></div><div class="big num">${money(total)}</div>
    <div class="row"><span>${debe>0?"Falta que paguen "+money(debe):total?"Todos pagaron ✓":"Sin gastos este mes"}</span><span>${mName(addM(m,1),{month:"long"})}: ${money(sig)} en cuotas</span></div></div>
  ${cupoHTML()}
  ${S.personas.length?`<div class="people">${ids.map(id=>{const p=persona(id);const t=totPersona(id,m);const ok=pagado(id,m);
    return `<div class="pc" ${pcStyle(p)} data-f="${id}" aria-pressed="${S.filtro===id}" role="button" tabindex="0"><div class="nm"><span>${esc(p.nombre)}</span>${t?`<button class="chk ${ok?"on":""}" data-pay="${id}" aria-label="Marcar pago de ${esc(p.nombre)}">${ok?"Pagó ✓":"Pendiente"}</button>`:""}</div><div class="amt num">${money(t)}</div></div>`;}).join("")}</div>`:""}
  <div class="card">
    <div class="sec"><h2>${m===TODAY_M?"Cuotas de este mes":m<TODAY_M?"Cuotas que se pagaron":"Cuotas que vienen"}</h2>${S.filtro!==""?`<span class="filter">Solo ${esc(persona(S.filtro).nombre)} · <button data-f="${S.filtro}">ver todas</button></span>`:`<span class="sub">${cm.length} cuotas</span>`}</div>
    ${items.length?`<div class="list">${items.map(({c,k,v})=>{const p=persona(c.persona);return`<div class="it" ${pcStyle(p)} data-ed="${c.id}"><span class="sw"></span><span class="t">${esc(c.nombre)}<small>${esc(p.nombre)} · ${money(c.total)}<span class="tag ${c.interes==="CI"?"ci":""}" title="${c.interes==="CI"?"Con interés":"Sin interés"}">${c.interes==="CI"?"C/I":"S/I"}</span></small></span><span class="m num">${money(v)}<small>${k} de ${c.cuotas}</small></span></div>`;}).join("")}</div>`:`<div class="empty">No hay cuotas este mes. Toca <b>+</b> para agregar un gasto.</div>`}
  </div>
  <div class="card">
    <div class="sec"><h2>Otros cargos y descuentos</h2><span class="sub">Ej: mantención</span></div>
    ${exF.length?`<div class="list">${exF.map(e=>{const ps=(e.personas||[]).map(persona);return`<div class="it" style="--pcol:${ps[0]?ps[0].color:"#9CA3AF"}" data-ex="${e.id}"><span class="sw" style="${ps.length>1?`background:linear-gradient(${ps.map(p=>p.color).join(",")})`:""}"></span><span class="t">${esc(e.nombre)}<small>${ps.map(p=>esc(p.nombre)).join(" + ")}${e.repite?" · todos los meses":""}</small></span><span class="m num" style="${e.monto<0?"color:var(--ok)":""}">${money(e.monto)}${ps.length>1?`<small>${money(parte(e,ps[0].id))} c/u</small>`:""}</span></div>`;}).join("")}</div>`:`<div class="empty" style="padding:8px">Nada este mes.</div>`}
    <button class="btn" style="width:100%;margin-top:8px" data-act="extra">+ Cargo o descuento</button>
  </div>
  <div class="links"><button data-act="personas">Personas y colores</button><button data-act="excel">Descargar Excel</button><button data-act="backup">Guardar respaldo</button><button data-act="restore">Cargar respaldo</button></div><input type="file" id="restoreFile" accept=".json,application/json" hidden>`;
}
function vDeudas(){
  const act=S.compras.map(c=>({c,e:estado(c)})).filter(x=>x.e.falta>0).sort((a,b)=>b.e.falta-a.e.falta);
  const total=sum(act,x=>x.e.falta);
  const ids=idsTodos().filter(id=>act.some(x=>(x.c.persona||"")===id));
  const libre=act.map(x=>x.e.ult).sort().pop();
  return `<div class="card hero peach"><div class="lab">Deuda total pendiente</div><div class="big num" style="color:var(--debt)">${money(total)}</div>
    <div class="row"><span>${act.length} productos con cuotas por pagar</span>${libre?`<span>Última cuota: ${mName(libre,{month:"short",year:"numeric"})}</span>`:""}</div></div>
  ${cupoHTML()}
  ${ids.length?`<div class="people">${ids.map(id=>{const p=persona(id);return`<div class="pc" ${pcStyle(p)} style="cursor:default"><div class="nm">${esc(p.nombre)}</div><div class="amt num">${money(sum(act.filter(x=>(x.c.persona||"")===id),x=>x.e.falta))}</div></div>`;}).join("")}</div>`:""}
  <div class="card"><div class="sec"><h2>Cada producto</h2><span class="sub">Toca uno para editarlo</span></div>
  ${act.length?act.map(({c,e})=>{const p=persona(c.persona);return`<div class="debtrow" ${pcStyle(p)} data-ed="${c.id}"><div class="hd"><b><span class="dot"></span>${esc(c.nombre)}</b><b class="num" style="color:var(--debt)">${money(e.falta)}</b></div>
    <div class="prog">${Array.from({length:Math.min(e.n,36)},(_,i)=>`<i class="${i<e.pag?"p":""}"></i>`).join("")}</div>
    <div class="meta"><span>${esc(p.nombre)} · ${e.pag} de ${e.n} pagadas · ${money(valor(c,addM(c.primerMes,c.cuotas-1))||c.valorCuota)} c/u <span class="tag ${c.interes==="CI"?"ci":""}">${c.interes==="CI"?"C/I":"S/I"}</span></span><span>hasta ${mShort(e.ult)}</span></div></div>`;}).join(""):`<div class="empty">No hay deudas pendientes 🎉</div>`}</div>`;
}
function vGraf(){
  const y=S.mes.slice(0,4);
  return `<div class="card"><h2>¿Quién gastó en ${mName(S.mes,{month:"long"})}?</h2><p class="sub">Reparto del total del mes por persona.</p><div class="chart" style="height:210px;margin-top:10px"><canvas id="cPie"></canvas></div><div class="legend" id="lPie"></div></div>
  <div class="card"><h2>Tendencia</h2><p class="sub">Total de cada mes por persona, 6 meses atrás y 6 adelante.</p><div class="chart tall" style="margin-top:10px"><canvas id="cTrend"></canvas></div></div>
  <div class="card"><h2>¿En qué se gasta más?</h2><p class="sub">Tiendas o productos que suman más en ${y}.</p><div class="rank" id="rank" style="margin-top:12px"></div></div>
  <div class="card"><h2>Dispersión de compras</h2><p class="sub">Cada punto es una compra: cuánto costó y en cuántas cuotas.</p><div class="chart tall" style="margin-top:10px"><canvas id="cScatter"></canvas></div></div>
  <div class="card"><h2>Total del año ${y}</h2><p class="sub">Lo que se paga de enero a diciembre.</p><div class="yeargrid num" id="year"></div></div>`;
}
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
function drawCharts(){
  if(typeof Chart==="undefined")return;
  Chart.defaults.font.family="Manrope, system-ui, sans-serif";Chart.defaults.color=css("--muted");
  const grid=css("--line"),ids=idsTodos(),m=S.mes;
  const pie=ids.map(id=>({p:persona(id),v:totPersona(id,m)})).filter(x=>x.v>0);const tp=sum(pie,x=>x.v);
  if(pie.length){charts.push(new Chart($("#cPie"),{type:"pie",data:{labels:pie.map(x=>x.p.nombre),datasets:[{data:pie.map(x=>x.v),backgroundColor:pie.map(x=>x.p.color),borderColor:css("--surface"),borderWidth:2}]},options:{maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>` ${money(c.raw)}`}}}}}));
    $("#lPie").innerHTML=pie.map(x=>`<div><span><span class="dot" style="--pcol:${x.p.color}"></span>${esc(x.p.nombre)}</span><span class="num"><b>${money(x.v)}</b> · ${Math.round(x.v/tp*100)}%</span></div>`).join("");}
  else $("#lPie").innerHTML=`<div class="empty">Sin gastos este mes.</div>`;
  const ms=Array.from({length:12},(_,i)=>addM(m,i-6));
  const ds=ids.map(id=>{const p=persona(id);return{type:"bar",label:p.nombre,data:ms.map(k=>totPersona(id,k)),backgroundColor:p.color,stack:"s",borderRadius:3};});
  ds.push({type:"line",label:"Total",data:ms.map(totMes),borderColor:css("--fg"),backgroundColor:css("--fg"),pointRadius:3,tension:.3,borderWidth:2});
  charts.push(new Chart($("#cTrend"),{data:{labels:ms.map(mShort),datasets:ds},options:{maintainAspectRatio:false,interaction:{mode:"index",intersect:false},plugins:{legend:{position:"bottom",labels:{boxWidth:10,boxHeight:10}},tooltip:{callbacks:{label:c=>` ${c.dataset.label}: ${money(c.raw)}`}}},scales:{x:{stacked:true,grid:{display:false}},y:{stacked:true,grid:{color:grid},border:{display:false},ticks:{callback:short}}},onClick:(e,el)=>{if(el.length){S.mes=ms[el[0].index];S.tab="mes";changed();}}}}));
  const y=m.slice(0,4),yms=Array.from({length:12},(_,i)=>`${y}-${pad(i+1)}`);
  const by={};S.compras.forEach(c=>{const v=yms.reduce((s,k)=>s+valor(c,k),0);if(v){const key=c.nombre.trim().toUpperCase();by[key]=(by[key]||0)+v;}});
  const rk=Object.entries(by).sort((a,b)=>b[1]-a[1]).slice(0,8),mx=rk[0]?rk[0][1]:1;
  $("#rank").innerHTML=rk.length?rk.map(([k,v])=>`<div class="r"><div class="top2"><b>${esc(k.charAt(0)+k.slice(1).toLowerCase())}</b><span class="num">${money(v)}</span></div><div class="bar"><i style="width:${v/mx*100}%"></i></div></div>`).join(""):`<div class="empty">Sin datos este año.</div>`;
  const sc=ids.map(id=>{const p=persona(id);return{label:p.nombre,backgroundColor:p.color,borderColor:css("--fg"),borderWidth:.5,pointRadius:7,pointHoverRadius:9,data:S.compras.filter(c=>(c.persona||"")===id).map(c=>({x:c.cuotas||1,y:c.total,n:c.nombre}))};});
  charts.push(new Chart($("#cScatter"),{type:"scatter",data:{datasets:sc},options:{maintainAspectRatio:false,plugins:{legend:{position:"bottom",labels:{boxWidth:10,boxHeight:10}},tooltip:{callbacks:{label:c=>` ${c.raw.n}: ${money(c.raw.y)} en ${c.raw.x} cuota${c.raw.x>1?"s":""}`}}},scales:{x:{title:{display:true,text:"N° de cuotas"},grid:{color:grid},ticks:{stepSize:1,precision:0},suggestedMin:0},y:{title:{display:true,text:"Valor de la compra"},grid:{color:grid},border:{display:false},ticks:{callback:short}}}}}));
  const yt=sum(yms,totMes);
  $("#year").innerHTML=`<div style="grid-column:1/-1;background:var(--lav)"><span class="sub" style="margin:0">Total ${y}</span><b>${money(yt)}</b></div>`+ids.map(id=>{const p=persona(id);return`<div style="--pcol:${p.color}"><span class="sub" style="margin:0"><span class="dot" style="--pcol:${p.color}"></span>${esc(p.nombre)}</span><b>${money(sum(yms,k=>totPersona(id,k)))}</b></div>`;}).join("");
}

/* ---- eventos ---- */
document.addEventListener("click",e=>{
  if(e.target.closest("#sheetRoot"))return;
  const t=e.target.closest("[data-tab],[data-pay],[data-f],[data-ed],[data-ex],[data-act]");if(!t)return;
  if(t.dataset.tab){S.tab=t.dataset.tab;try{localStorage.setItem("cc-celular-tab",S.tab);}catch(x){}window.scrollTo(0,0);changed();return;}
  if(t.dataset.pay!==undefined){togglePago(t.dataset.pay);return;}
  if(t.dataset.f!==undefined){S.filtro=S.filtro===t.dataset.f?"":t.dataset.f;changed();return;}
  if(t.dataset.ed){formCompra(S.compras.find(c=>c.id===t.dataset.ed));return;}
  if(t.dataset.ex){formExtra(S.extras.find(c=>c.id===t.dataset.ex));return;}
  const a=t.dataset.act;if(a==="cupo")formCupo();if(a==="extra")formExtra(null);if(a==="personas")formPersonas();if(a==="excel")excel();if(a==="backup")backup();if(a==="restore")$("#restoreFile").click();
});
document.addEventListener("keydown",e=>{if(e.key==="Escape")close();if(e.key==="Enter"&&e.target.matches(".pc,.cupo"))e.target.click();});
$("#mPrev").onclick=()=>{S.mes=addM(S.mes,-1);changed();};
$("#mNext").onclick=()=>{S.mes=addM(S.mes,1);changed();};
$("#mLbl").onclick=()=>{S.mes=TODAY_M;changed();};
$("#fab").onclick=()=>formCompra(null);
try{matchMedia("(prefers-color-scheme: dark)").addEventListener("change",changed);new MutationObserver(changed).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});}catch(e){}
async function togglePago(pid){const m=S.mes;const d=S.pagos.find(p=>p.id===m);const p={...((d&&d.p)||{})};p[pid]=!p[pid];
  try{await save("pagos",{id:m,p});toast(p[pid]?persona(pid).nombre+" pagó "+mName(m,{month:"long"}):"Marcado como pendiente");}catch(e){}}

/* ---- hojas (formularios) ---- */
function open(title,body,mount){$("#sheetRoot").innerHTML=`<div class="ov" id="ov"><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="hd"><h2>${title}</h2><button class="x" id="sx" aria-label="Cerrar">✕</button></div>${body}</div></div>`;
  $("#sx").onclick=close;$("#ov").addEventListener("mousedown",e=>{if(e.target.id==="ov")close();});mount();}
function close(){$("#sheetRoot").innerHTML="";}
let tt;function toast(m){$("#toastRoot").innerHTML=`<div class="toast" role="status">${esc(m)}</div>`;clearTimeout(tt);tt=setTimeout(()=>$("#toastRoot").innerHTML="",2600);}
function money$(el,cb){el.addEventListener("input",()=>{const neg=el.dataset.neg&&/-/.test(el.value);const n=Math.abs(parseN(el.value));el.value=(neg?"-":"")+fmtIn(n);cb&&cb();});}
const chipsP=(sel,multi)=>`<div class="chips" data-multi="${multi?1:""}">${personasOrd().map(p=>`<button type="button" data-pid="${p.id}" aria-pressed="${sel.includes(p.id)}"><span class="dot" style="--pcol:${p.color}"></span>${esc(p.nombre)}</button>`).join("")}</div>`;
function bindChips(root,multi){$$(root+" [data-pid]").forEach(b=>b.onclick=()=>{if(!multi)$$(root+" [data-pid]").forEach(x=>x.setAttribute("aria-pressed","false"));b.setAttribute("aria-pressed",String(b.getAttribute("aria-pressed")!=="true"));});}
const chosen=root=>$$(root+" [data-pid][aria-pressed=true]").map(b=>b.dataset.pid);

function formCompra(c){
  const nuevo=!c;c=c?{...c}:{nombre:"",total:0,interes:"SI",cuotas:1,valorCuota:0,persona:personasOrd()[0]?.id||"",primerMes:S.mes};
  const k0=nuevo?1:Math.max(1,Math.min(c.cuotas,nCuota(c,S.mes)));
  let manual=nuevo?false:Math.round(c.valorCuota*c.cuotas)!==Math.round(c.total);
  open(nuevo?"Agregar gasto":"Editar gasto",`
    <div class="f"><label for="cN">¿Qué compraste?</label><input class="inp" id="cN" value="${esc(c.nombre)}" placeholder="Ej: Líder, Zapatillas, Latam" maxlength="60"></div>
    <div class="f"><label for="cT">Monto total</label><input class="inp num" id="cT" inputmode="numeric" value="${fmtIn(c.total)}" placeholder="$0"></div>
    <div class="f"><span class="lb">¿De quién es?</span><div id="cP">${chipsP([c.persona],false)}</div></div>
    <div class="two"><div class="f"><span class="lb">Cuotas</span><div class="step"><button type="button" id="cMinus" aria-label="Menos cuotas">−</button><input id="cC" inputmode="numeric" value="${c.cuotas}" aria-label="Número de cuotas"><button type="button" id="cPlus" aria-label="Más cuotas">+</button></div></div>
      <div class="f"><span class="lb">Interés</span><div class="seg" id="cI"><button type="button" data-i="SI" aria-pressed="${c.interes!=="CI"}">S/I<small>Sin interés</small></button><button type="button" data-i="CI" aria-pressed="${c.interes==="CI"}">C/I<small>Con interés</small></button></div></div></div>
    <div class="two"><div class="f"><label for="cV">Valor cuota</label><input class="inp num" id="cV" inputmode="numeric" value="${fmtIn(c.valorCuota)}"></div>
      <div class="f"><label for="cK">En ${mName(S.mes,{month:"long"})} va en la cuota</label><select class="inp" id="cK"></select></div></div>
    <div class="calc num" id="cRes"></div><div class="err" id="cE"></div>
    <div class="btns">${nuevo?"":`<button class="btn del" id="cDel">Borrar</button>`}<button class="btn" id="cX">Cancelar</button><button class="btn pri" id="cS">Guardar</button></div>`,()=>{
    bindChips("#cP",false);
    let interes=c.interes==="CI"?"CI":"SI";
    $$("#cI button").forEach(b=>b.onclick=()=>{interes=b.dataset.i;$$("#cI button").forEach(x=>x.setAttribute("aria-pressed",x===b));});
    const n=()=>Math.max(1,Math.min(48,parseInt($("#cC").value)||1));
    // siempre ofrece de la cuota 1 a la 12 (o más si hay más cuotas); elegir una mayor sube el total
    const fillK=keep=>{const cur=keep||parseInt($("#cK").value)||1;const N=n();const L=Math.max(12,N);$("#cK").innerHTML=Array.from({length:L},(_,i)=>`<option value="${i+1}" ${i+1===Math.min(cur,L)?"selected":""}>${i+1} de ${Math.max(N,i+1)}</option>`).join("");};
    const calc=()=>{const T=Math.abs(parseN($("#cT").value)),N=n();if(!manual)$("#cV").value=fmtIn(T/N);const V=Math.abs(parseN($("#cV").value));const K=parseInt($("#cK").value)||1;const pm=addM(S.mes,-(K-1));
      $("#cRes").innerHTML=T?`${N} cuota${N>1?"s":""} de <b>${money(V)}</b> · de ${mShort(pm)} a ${mShort(addM(pm,N-1))}${V*N-T>N?` · <span style="color:var(--debt)">pagas ${money(V*N-T)} de interés</span>`:""}`:"Escribe el monto para ver el resultado.";};
    fillK(k0);money$($("#cT"),calc);money$($("#cV"),()=>{manual=true;calc();});
    const fitK=()=>fillK(Math.min(parseInt($("#cK").value)||1,n()));
    $("#cC").addEventListener("input",()=>{fitK();calc();});
    $("#cMinus").onclick=()=>{$("#cC").value=n()-1||1;fitK();calc();};$("#cPlus").onclick=()=>{$("#cC").value=Math.min(48,n()+1);fitK();calc();};
    $("#cK").onchange=()=>{const K=parseInt($("#cK").value)||1;if(K>n()){$("#cC").value=K;fillK(K);}calc();};calc();
    $("#cX").onclick=close;
    $("#cS").onclick=async()=>{const nombre=$("#cN").value.trim(),total=Math.abs(parseN($("#cT").value)),per=chosen("#cP")[0]||"";
      if(!nombre||!total){$("#cE").textContent="Escribe qué compraste y el monto.";return;}
      if(!per&&S.personas.length){$("#cE").textContent="Elige de quién es.";return;}
      const K=parseInt($("#cK").value)||1,N=Math.max(n(),K);
      $("#cS").disabled=true;
      const pm=addM(S.mes,-(K-1));
      // conserva los valores exactos de meses ya registrados (Excel) si la compra no cambió de mes de inicio
      const hist=(!nuevo&&c.valores&&pm===c.primerMes)?{valores:c.valores,hastaExcel:c.hastaExcel}:{};
      try{await save("compras",{id:c.id,nombre,total,interes,cuotas:N,valorCuota:Math.abs(parseN($("#cV").value))||Math.round(total/N),persona:per,primerMes:pm,creado:c.creado||new Date().toISOString(),...hist});close();toast(nuevo?"Gasto agregado":"Cambios guardados");}catch(e){$("#cS").disabled=false;}};
    if(!nuevo)$("#cDel").onclick=async()=>{if($("#cDel").dataset.sure){await del("compras",c.id);close();toast("Gasto borrado");}else{$("#cDel").dataset.sure=1;$("#cDel").textContent="¿Seguro? Toca otra vez";}};
    if(nuevo)setTimeout(()=>$("#cN").focus(),50);
  });
}
function formExtra(e){
  const nuevo=!e;e=e?{...e}:{nombre:"",monto:0,personas:[],repite:false,desde:S.mes};
  const neg=e.monto<0;
  open(nuevo?"Cargo o descuento":"Editar cargo",`
    <div class="seg" id="xT"><button type="button" data-t="c" aria-pressed="${!neg}">Cargo<small>Ej: mantención</small></button><button type="button" data-t="d" aria-pressed="${neg}">Descuento<small>Ej: devolución</small></button></div>
    <div class="f"><label for="xN">Nombre</label><input class="inp" id="xN" value="${esc(e.nombre)}" placeholder="Ej: Mantención" maxlength="60"></div>
    <div class="f"><label for="xM">Monto</label><input class="inp num" id="xM" inputmode="numeric" value="${fmtIn(Math.abs(e.monto))}" placeholder="$0"></div>
    <div class="f"><span class="lb">¿Quién lo paga? (si eliges varias, se divide)</span><div id="xP">${chipsP(e.personas||[],true)}</div></div>
    <label style="display:flex;gap:10px;align-items:center;font-weight:700"><input type="checkbox" id="xR" ${e.repite?"checked":""} style="width:20px;height:20px"> Se repite todos los meses</label>
    <div class="calc num" id="xRes"></div><div class="err" id="xE"></div>
    <div class="btns">${nuevo?"":`<button class="btn del" id="xD">${e.repite&&e.desde<S.mes?"Quitar desde este mes":"Borrar"}</button>`}<button class="btn" id="xX">Cancelar</button><button class="btn pri" id="xS">Guardar</button></div>`,()=>{
    let tipo=neg?"d":"c";bindChips("#xP",true);
    $$("#xT button").forEach(b=>b.onclick=()=>{tipo=b.dataset.t;$$("#xT button").forEach(x=>x.setAttribute("aria-pressed",x===b));calc();});
    const calc=()=>{const M=Math.abs(parseN($("#xM").value)),ps=chosen("#xP");$("#xRes").textContent=M&&ps.length>1?`Cada una paga ${money(Math.ceil(M/ps.length/100)*100)} (redondeado a la centena)`:"";};
    money$($("#xM"),calc);$("#xP").addEventListener("click",()=>setTimeout(calc));calc();
    $("#xX").onclick=close;
    $("#xS").onclick=async()=>{const nombre=$("#xN").value.trim(),M=Math.abs(parseN($("#xM").value)),ps=chosen("#xP");
      if(!nombre||!M||!ps.length){$("#xE").textContent="Completa nombre, monto y quién lo paga.";return;}
      await save("extras",{id:e.id,nombre,monto:tipo==="d"?-M:M,personas:ps,repite:$("#xR").checked,desde:e.desde||S.mes,hasta:e.hasta||""});close();toast("Guardado");};
    if(!nuevo)$("#xD").onclick=async()=>{if(e.repite&&e.desde<S.mes){await save("extras",{...e,hasta:addM(S.mes,-1)});}else await del("extras",e.id);close();toast("Listo");};
  });
}
function formCupo(){
  const r=cupoReal();
  open("Cupo de la tarjeta",`<div class="f"><label for="kD">Cupo disponible hoy (míralo en la app del banco)</label><input class="inp num" id="kD" inputmode="numeric" value="${fmtIn(r.disp)}"></div>
    <div class="f"><label for="kC">Cupo máximo</label><input class="inp num" id="kC" inputmode="numeric" value="${fmtIn(cupoMax())}"></div>
    <p class="sub" style="margin:0">Desde ahora, cada compra nueva que agregues se descuenta sola del disponible. Cuando quieras, vuelve a poner el dato del banco para que quede exacto.</p>
    <div class="btns"><button class="btn" id="kX">Cancelar</button><button class="btn pri" id="kS">Guardar</button></div>`,()=>{
    money$($("#kC"));money$($("#kD"));$("#kX").onclick=close;
    $("#kS").onclick=async()=>{const v=Math.abs(parseN($("#kC").value)),d=Math.abs(parseN($("#kD").value));if(!v)return;await save("config",{id:"tarjeta",cupo:v,disponible:d,fecha:new Date().toISOString()});close();toast("Cupo actualizado");};});
}
function formPersonas(){
  const row=p=>`<div class="prow" data-p="${p.id}"><input class="inp" value="${esc(p.nombre)}" maxlength="24" aria-label="Nombre"><div class="swatches">${COLORS.map(c=>`<button type="button" data-c="${c}" style="background:${c}" aria-pressed="${c===p.color}" aria-label="Color"></button>`).join("")}</div></div>`;
  open("Personas y colores",`<p class="sub" style="margin:0">Cada persona tiene un color, como en tu Excel.</p><div id="pl">${personasOrd().map(row).join("")}</div>
    <button class="btn" id="pAdd">+ Agregar persona</button><div class="err" id="pE"></div><div class="btns"><button class="btn" id="pX">Cancelar</button><button class="btn pri" id="pS">Guardar</button></div>`,()=>{
    const bind=()=>$$("#pl .prow").forEach(r=>r.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{r.querySelectorAll("[data-c]").forEach(x=>x.setAttribute("aria-pressed",x===b));}));
    bind();$("#pAdd").onclick=()=>{$("#pl").insertAdjacentHTML("beforeend",row({id:"new-"+genId(),nombre:"",color:COLORS[S.personas.length%COLORS.length]}));bind();$("#pl .prow:last-child input").focus();};
    $("#pX").onclick=close;
    $("#pS").onclick=async()=>{const rows=$$("#pl .prow");let i=0;
      for(const r of rows){const nombre=r.querySelector("input").value.trim();const id=r.dataset.p;const color=(r.querySelector("[aria-pressed=true]")||{}).dataset?.c||COLORS[0];
        if(!nombre){if(!id.startsWith("new-")){if(S.compras.some(c=>c.persona===id)){$("#pE").textContent="No puedes borrar a alguien que tiene gastos.";return;}await del("personas",id);}continue;}
        await save("personas",{id:id.startsWith("new-")?undefined:id,nombre,color,orden:i++});}
      close();toast("Personas guardadas");};
  });
}
async function excel(){
  if(typeof XLSX==="undefined"){toast("No se pudo cargar Excel.");return;}
  const wb=XLSX.utils.book_new();const ms=Array.from({length:12},(_,i)=>addM(S.mes,i-6));
  for(const m of ms){const cm=cuotasMes(m),ex=extrasMes(m);if(!cm.length&&!ex.length)continue;
    const rows=cm.map(({c,k,v})=>[c.nombre,c.total,c.interes==="CI"?"C/I":"S/I",`${k} de ${c.cuotas}`,v,persona(c.persona).nombre]);
    ex.forEach(e=>rows.push([e.nombre,e.monto,"","","",(e.personas||[]).map(p=>persona(p).nombre).join(" + ")]));
    rows.push([]);idsTodos().forEach(id=>rows.push([persona(id).nombre,totPersona(id,m),pagado(id,m)?"✓":""]));
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([["Compra","Total","Interés","Cuota","Valor cuota","Persona"],...rows]),mName(m).toUpperCase().slice(0,31));}
  if(!wb.SheetNames.length){toast("No hay datos para exportar.");return;}
  bajar(new Blob([XLSX.write(wb,{type:"array",bookType:"xlsx"})],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}),`cuentas-claras-${S.mes}.xlsx`);
}

function bajar(blob,name){const u=URL.createObjectURL(blob);const a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);toast("Descargando "+name);}
function backup(){const d={};COLS.forEach(c=>d[c]=S[c]);bajar(new Blob([JSON.stringify(d)],{type:"application/json"}),"respaldo-cuentas-claras-"+new Date().toISOString().slice(0,10)+".json");}
document.addEventListener("change",async e=>{if(e.target.id!=="restoreFile"||!e.target.files[0])return;
  try{const d=JSON.parse(await e.target.files[0].text());if(!d||!Array.isArray(d.compras)||!Array.isArray(d.personas))throw 0;
    COLS.forEach(c=>S[c]=Array.isArray(d[c])?d[c]:[]);persist();changed();toast("Respaldo cargado: "+S.compras.length+" compras");}
  catch(x){toast("Ese archivo no es un respaldo de Cuentas Claras.");}e.target.value="";});

render();status();
init();
})();
</script>
